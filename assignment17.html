<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 17</title>
<style>
  input { display: block; margin: 8px 0; width: 220px; }
  input[type=number] { width: 110px; }
</style>
</head>
<body>
<form action="submit.php" method="post">
  <input type="text" name="name" placeholder="Full name" required>
  <input type="email" name="email" placeholder="you@college.edu" required>
  <input type="text" name="mobile" placeholder="10-digit mobile" required
         pattern="[0-9]{10}" title="Enter exactly 10 digits">
  <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
  <input type="number" name="age" placeholder="Age (17-30)" min="17" max="30" required>
  <button type="submit">Register</button>
</form>
</body>
