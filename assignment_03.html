<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3 - Block and Inline Elements</title>
    <style>
        .block-example { background: #dceeff; padding: 10px; margin: 8px 0; }
        .inline-example { background: #ffe5b4; }
    </style>
</head>
<body>
    <h1>Block and Inline Elements</h1>
    <h2>Block Elements</h2>
    <div class="block-example">This is a div element (block).</div>
    <p class="block-example">This is a paragraph element (block).</p>
    <h2>Inline Elements</h2>
    <p>Here are inline elements:
        <span class="inline-example">span</span>,
        <strong class="inline-example">strong</strong>, and
        <a href="https://www.example.com">a link</a>.
    </p>
</body>
</html>
