<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 7 - Navigation Menu</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        nav { background: #222; padding: 14px; }
        nav ul { list-style: none; display: flex; gap: 25px; margin: 0; padding: 0; }
        nav a { color: white; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { padding: 20px; }
    </style>
</head>
<body>
    <nav aria-label="Main navigation">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h1 id="home">Welcome</h1>
        <section id="about"><h2>About</h2><p>About our website.</p></section>
        <section id="services"><h2>Services</h2><p>Our services.</p></section>
        <section id="contact"><h2>Contact</h2><p>Contact us for more information.</p></section>
    </main>
</body>
</html>
