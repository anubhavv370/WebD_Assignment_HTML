<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 12 - HTML Table</title>
    <style>
        table { border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid black; padding: 10px; text-align: left; }
        thead, tfoot { background: #e8e8e8; }
    </style>
</head>
<body>
    <h1>Student Marks</h1>
    <table>
        <caption>Semester 1 Result</caption>
        <thead>
            <tr><th scope="col">Roll No.</th><th scope="col">Name</th><th scope="col">Subject</th><th scope="col">Marks</th></tr>
        </thead>
        <tbody>
            <tr><td>101</td><td>Aman</td><td>Mathematics</td><td>85</td></tr>
            <tr><td>102</td><td>Riya</td><td>Physics</td><td>90</td></tr>
            <tr><td>103</td><td>Rahul</td><td>Programming</td><td>88</td></tr>
        </tbody>
        <tfoot>
            <tr><th colspan="3" scope="row">Total Marks</th><td>263</td></tr>
        </tfoot>
    </table>
</body>
</html>
