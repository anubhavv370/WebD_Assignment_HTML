<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
    }
    .skip-link {
      position: absolute;
      left: -999px;
    }
    .skip-link:focus {
      left: 10px;
      top: 10px;
      background: #fff;
      padding: 6px;
    }
    header, footer {
      background: #1a237e;
      color: #fff;
      text-align: center;
    }
    header { padding: 20px; }
    header h1 { margin: 0; }
    footer { padding: 10px; }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 10px 0 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }
    th, td {
      border: 1px solid #999;
      padding: 6px;
      text-align: left;
    }
    th {
      background: #e8eaf6;
      text-align: center;
    }
    fieldset { padding: 10px 15px; }
    label { display: block; margin-top: 8px; }
    input, select, textarea { margin-bottom: 12px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main id="main-content">
    <h2>Courses and Fees</h2>

    <table>
      <caption>Available Courses</caption>
      <thead>
        <tr>
          <th scope="col">Course</th>
          <th scope="col">Seats</th>
          <th scope="col">Fees</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>B.Tech CSE</td>
          <td>120</td>
          <td>&#8377;90,000</td>
        </tr>
        <tr>
          <td>BCA</td>
          <td>60</td>
          <td>&#8377;45,000</td>
        </tr>
      </tbody>
    </table>

    <form action="submit.php" method="post">
      <fieldset>
        <legend>Application Form</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="course">Course:</label>
        <select id="course" name="course">
          <option value="btech">B.Tech CSE</option>
          <option value="bca">BCA</option>
        </select>

        <label for="statement">Statement:</label>
        <textarea id="statement" name="statement" rows="4" cols="50"></textarea>

        <br>
        <button type="submit">Apply</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 ABC College</p>
  </footer>
</body>
</html>
